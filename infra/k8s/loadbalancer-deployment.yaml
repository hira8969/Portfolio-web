apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-loadbalancer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-loadbalancer
  template:
    metadata:
      labels:
        app: portfolio-loadbalancer
    spec:
      containers:
        - name: loadbalancer
          image: portfolio-loadbalancer:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-loadbalancer
spec:
  type: LoadBalancer
  selector:
    app: portfolio-loadbalancer
  ports:
    - port: 80
      targetPort: 80
